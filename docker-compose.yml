# Starts PostgreSQL, the API and the web app:  docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://crm:crm@db:5432/crm
      JWT_SECRET: change-me-in-production
      CORS_ORIGIN: http://localhost:5173
    ports: ["5000:5000"]
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:20-alpine
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      VITE_PROXY_TARGET: http://api:5000
    ports: ["5173:5173"]
    depends_on: [api]

volumes:
  pgdata:
